# Optional local MySQL 8 for the warehouse:
#   docker compose up -d
#   python -m finpulse.pipeline --db-url "mysql+pymysql://finpulse:finpulse@localhost:3306/finpulse"
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: finpulse
      MYSQL_USER: finpulse
      MYSQL_PASSWORD: finpulse
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
